# Publish everything the release host serves to GitHub Pages: the update
# artifacts a device downloads and the manifest that lists them, the three boot
# images the browser flasher writes in front of the app, and the pages themselves
# (pages/ — a landing page and /flash/).
#
# Pages is the publish host because the device needs exactly one thing: stable
# URLs that return bytes. It has no use for tags, an API or release metadata, and
# every one of those is a way for a check to fail before it reaches a firmware
# byte. The manifest IS the version pointer — publishing a new version means
# overwriting one file, so the device asks nothing and simply reads.
#
# The pages ride along in the same deploy rather than in one of their own, because
# the flasher offers whatever the manifest beside it names: split the two and a
# site could offer a version the host is not holding.
#
# BASE must match the served origin exactly: the manifest embeds absolute URLs,
# and the device fetches what it is told, not what was meant. It is also what
# UPDATE_MANIFEST_URL (or a stored override) has to point at, with /manifest.json.
#
# Cutting a release is `git tag v0.1.9 && git push --tags`. Bump include/version.h
# (firmware) and/or web/VERSION (bundle) FIRST — a device only installs an
# artifact whose code beats what it already runs, so an unbumped publish is a
# publish nobody receives.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# What deploy-pages needs: an OIDC token to prove the deployment came from this
# workflow, and nothing more than read on the repo itself.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A publish that cannot finish should fail rather than hold the deploy slot:
    # every step here is minutes, so anything near the cap is stuck, not slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Generate the sprite/palette codegen
        run: python3 tools/gen_assets.py
      - name: Build the artifacts, the manifest and the pages
        # `make pages` builds the firmware image and the web bundle, writes
        # manifest.json over them, then validates it with the DEVICE's own parser
        # (build/check_manifest). A manifest the device would reject looks exactly
        # like a dead network from the operator's side, so the publish fails here
        # instead of on her desk. It then stages the boot images and pages/ beside
        # them, failing just as loudly if a boot image is missing — a flasher that
        # 404s partway through is worse than a publish that didn't happen.
        run: make pages BASE=https://antvena.github.io/Malwarium
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, and never cancel one midway — a half-deployed Pages
    # site is a manifest pointing at artifacts that may not be there yet. Only
    # the DEPLOY is serialised, not the whole workflow: a concurrency group at
    # workflow level parks the loser as a run with no jobs in it, and a run with
    # no jobs is one the API will neither cancel nor delete if it ever stops
    # advancing — it just holds the group against every later publish. Held here,
    # a blocked publish is a visible queued job inside a run that `gh run cancel`
    # can clear. Builds are free to overlap; they only produce artifacts, and the
    # last deploy to run is the one the site serves either way.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
