# The two gates the normal build cycle runs, on every push and pull request.
# Native first because it is fast and catches most things; the S3 build follows
# because device-tier code (src/platform/esp32) compiles nowhere else, so a
# green native run says nothing about whether the firmware still links.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the sprite/palette codegen
        # src/generated is not committed — it is derived from assets/, and the
        # engine does not compile without it.
        run: python3 tools/gen_assets.py
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: 'Pedia data freshness
        # Here and NOT in tools/gates.sh: this guards a PUBLISH, not a build. Stale
        # pedia data cannot break the firmware or the device, and gates.sh is the
        # tight edit loop whose whole bet is that it stays cheap enough to always
        # run. This job already has the two halves the check needs — a C++ compiler
        # for tools/dump_content.cpp and python3 — so it costs one compile here.
        #
        # It catches two things: a content-table edit that never got re-generated,
        # and a generator that can no longer parse what it scrapes (gen_pedia_data.py
        # reads the wild roster out of a named function, so moving that function
        # breaks it silently). Without this, the first thing to notice either is a
        # `make pedia-tar`, i.e. too late.
        run: make pedia-check

  device:
    name: S3 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache the PlatformIO toolchain
        # The espressif32 platform and its Xtensa toolchain are a few hundred MB
        # and change only when platformio.ini does. Without this every run pays
        # the download again.
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Generate the sprite/palette codegen
        run: python3 tools/gen_assets.py
      - name: Build
        run: pio run -e waveshare_s3_154
