; platformio.ini — Malwarium firmware build matrix.
;
; Host (CMake + SDL2) and native gates (test/native via ctest) remain the
; primary dev loop; the ESP32 envs below are the device tier. The portable
; engine (src/core, src/generated) compiles unchanged on every target — only
; src/platform/<tier> differs, so build_src_filter swaps the platform layer
; and drops the host's SDL main.
;
; Display library: LovyanGFX (PROJECT_SPEC §3). Regenerate src/generated first
; (python3 tools/gen_assets.py) — it is git-ignored.

[platformio]
default_envs = native

[env]
build_flags = -std=gnu++17 -Isrc -Iinclude

[env:native]
platform = native
test_framework = unity
; Compile only the portable engine; the platform layers pull in SDL (host) and
; Arduino/LovyanGFX (esp32), neither of which links on the native test host.
; test/native/test_main.cpp is the same gate file ctest runs — it compiles into
; a Unity suite here (PIO_UNIT_TESTING flips it; see its main()).
build_src_filter = +<core/> +<generated/>
test_build_src = yes
build_flags = ${env.build_flags}

; --- Device: Waveshare ESP32-S3-LCD-1.54 (primary / reference) --------------
[env:waveshare_s3_154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_malwarium.csv  ; two 7.5MiB OTA slots + a 256KB save NVS (see the CSV header)
; The board has 16MB flash (esptool flash_id: Device 4018) and 8MB PSRAM, but
; the generic esp32-s3-devkitc-1 definition declares 8MB and no PSRAM. Without
; these two the upload writes an 8MB-sized flash header and PlatformIO's size
; check rejects a partition table that runs past 8MB. PSRAM is left disabled —
; nothing needs it yet (RAM sits near 20%), so it stays a deliberate later step.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_port = /dev/cu.usbmodem14401
monitor_port = /dev/cu.usbmodem14401
monitor_speed = 115200
build_src_filter = +<*> -<platform/host/> -<platform/esp32/bringup_min.cpp>
build_unflags = -std=gnu++11   ; framework default; we need C++17 (inline vars, constexpr bodies)
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_S3_154=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over native USB (the /dev/cu.usbmodem port)
    -DARDUINO_USB_MODE=1
lib_deps = lovyan03/LovyanGFX

; First-flash bring-up: renders the engine AND scans candidate GPIOs so a button
; press prints its pin to serial (discovers PLUS/PWR). Compiled out for the real
; build once the pins are pasted into config.h.
[env:waveshare_s3_154_bringup]
extends = env:waveshare_s3_154
build_flags = ${env:waveshare_s3_154.build_flags} -DBRINGUP_PINSCAN=1

; Minimal diagnostic: bypasses the engine (main.cpp excluded) — just serial +
; full-screen colour cycling, to prove the USB-CDC and panel paths in isolation.
[env:waveshare_s3_154_min]
extends = env:waveshare_s3_154
build_src_filter = +<*> -<platform/host/> -<platform/esp32/main.cpp>
build_flags = ${env:waveshare_s3_154.build_flags} -DBRINGUP_MINIMAL=1

[env:wokwi_sim]
extends = env:waveshare_s3_154
